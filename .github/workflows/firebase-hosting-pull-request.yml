name: Build and test on PR
on: pull_request
permissions:
  contents: read
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # No preview deploy: previews were built with the committed production
      # env and wrote/read against the live backend. Re-enable previews only
      # against a staging project (see docs/IMPLEMENTATION_PLAN.md).
