name: Build and test on PR
on: pull_request
permissions:
  contents: read
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # No preview deploy: previews were built with the committed production
      # env and wrote/read against the live backend. Re-enable previews only
      # against a staging project (see docs/IMPLEMENTATION_PLAN.md).
